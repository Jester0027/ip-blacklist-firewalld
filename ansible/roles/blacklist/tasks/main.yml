---
- name: Ensure firewalld and python dependencies are installed
  become: true
  ansible.builtin.dnf:
    name:
      - firewalld
      - python3-packaging
      - python3-pip
    state: present

- name: Ensure firewalld is running
  become: true
  ansible.builtin.service:
    name: firewalld
    enabled: true
    state: started

- name: Ensure script project directory exists
  become: true
  ansible.builtin.file:
    state: directory
    path: /opt/update-blacklist/
    owner: root
    group: root
    mode: "0755"

- name: Copy blacklist python project
  become: true
  ansible.builtin.copy:
    src: blacklist/
    dest: /opt/update-blacklist/
    owner: root
    group: root
    mode: "0755"
  notify: Install dependencies

- name: Create venv
  become: true
  ansible.builtin.command:
    cmd: python3 -m venv /opt/update-blacklist/.venv
    creates: /opt/update-blacklist/.venv/bin/python

- name: Setup blacklist systemd units
  notify: Reload systemd
  become: true
  block:
    - name: Create blacklist service
      ansible.builtin.template:
        src: update-blacklist.service.j2
        dest: /etc/systemd/system/update-blacklist.service
        owner: root
        group: root
        mode: "0744"

    - name: Create blacklist timer
      ansible.builtin.template:
        src: update-blacklist.timer.j2
        dest: /etc/systemd/system/update-blacklist.timer
        owner: root
        group: root
        mode: "0744"

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable the timer
  become: true
  ansible.builtin.systemd:
    unit: update-blacklist.timer
    enabled: true
    state: started
